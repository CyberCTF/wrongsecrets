# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP WrongSecrets (by Jeroen Willemsen and the OWASP WrongSecrets contributors): an app full of
# badly stored secrets, with challenges on finding them in code, containers, configuration,
# binaries and more. This is upstream's Docker variant (no vault, no cloud): the challenges that
# need Kubernetes, Vault or a cloud account show as unavailable. Source:
# https://github.com/OWASP/wrongsecrets, vendored in build/wrongsecrets/app/, built by its own
# Dockerfile (plus a stage that builds the jar). It runs in CTF mode: each solved challenge gives
# a code, HMAC-SHA1(key, challenge name), the key set from CTF_FLAG_CTF_KEY by the overlay's
# ctf-entrypoint.sh. `isoloom generate`, then `isoloom up docker`.
version: 1
name: wrongsecrets

# Given by the CyberCTF launcher: this player's key, from which every challenge code derives.
# Without it, upstream's default ctf_key (the development key).
inputs:
  CTF_FLAG_CTF_KEY: {}

networks:
  lab: {cidr: 10.60.123.0/24}

machines:
  wrongsecrets:
    networks: {lab: 10}
    resources: {cpus: 2, memory_mb: 2048}
    ports:
      web:
        port: 8080
        protocol: http
        publish: true
      mcp:
        port: 8090
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_ctf_key
        input: CTF_FLAG_CTF_KEY
    app:
      build: build/wrongsecrets
checks:
  - {name: the app answers, http: "http://wrongsecrets:8080/", wait: 300}
  - {name: the first challenge answers, http: "http://wrongsecrets:8080/challenge/challenge-1"}
  - checks/wrongsecrets.sh

message: |
  OWASP WrongSecrets answers at {{ machines.wrongsecrets.ports.web.url }}.
  Start with challenge 1 ("Find the hardcoded password"); the challenges marked for Docker all
  run here. Its MCP server (challenge 60) answers on port {{ machines.wrongsecrets.ports.mcp.published }}.
  Each solved challenge gives a code: submit it to CyberCTF.
