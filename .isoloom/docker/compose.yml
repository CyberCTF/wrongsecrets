name: wrongsecrets
services:
  wrongsecrets:
    build:
      context: ../../build/wrongsecrets
      labels:
        isoloom.managed: 'true'
        isoloom.environment: wrongsecrets
    image: isoloom/wrongsecrets-wrongsecrets
    platform: linux/amd64
    hostname: wrongsecrets
    networks:
      lab:
        ipv4_address: 10.60.123.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8080}:8080
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8090}:8090
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8080 && /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8090
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2048M
    labels:
      isoloom.service.web: http:8080
      isoloom.service.mcp: http:8090
      isoloom.managed: 'true'
      isoloom.environment: wrongsecrets
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    depends_on:
      wrongsecrets:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: wrongsecrets
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: wrongsecrets
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.123.0/24
        gateway: 10.60.123.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: wrongsecrets
volumes:
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: wrongsecrets
